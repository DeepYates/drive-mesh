# Build the game and publish static/ to GitHub Pages.
# Needs: Settings -> Pages -> Source = "GitHub Actions", and a repository variable
# TILES_BASE = https://<worker>.workers.dev/tiles/ (the Worker in worker/).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require the Worker URL
        env:
          TILES_BASE: ${{ vars.TILES_BASE }}
        run: |
          case "$TILES_BASE" in
            https://*/tiles/) ;;
            *) echo "::error::Set the repository variable TILES_BASE to https://<worker>/tiles/"; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run build
        env:
          TILES_BASE: ${{ vars.TILES_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deploy
        uses: actions/deploy-pages@v4
